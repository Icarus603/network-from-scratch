[workspace]
resolver = "2"
members = [
    "crates/proteus-spec",
    "crates/proteus-wire",
    "crates/proteus-crypto",
    "crates/proteus-shape",
    "crates/proteus-handshake",
    "crates/proteus-transport-alpha",
    "crates/proteus-transport-beta",
    "crates/proteus-fingerprint",
    "crates/proteus-panic-hook",
    "crates/proteus-sd-notify",
    "crates/proteus-ech",
    "crates/proteus-server",
    "crates/proteus-client",
    "crates/proteus-bench",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Icarus (Icarus603) <noreply@example.com>"]
repository = "https://github.com/Icarus603/network-from-scratch"
rust-version = "1.85"

[workspace.dependencies]
# Spec / wire helpers
zerocopy = "0.7"
bytes = "1.7"
thiserror = "1.0"

# Crypto primitives (RustCrypto family, audited and pure-Rust)
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "reusable_secrets"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
ml-kem = { version = "0.2", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["alloc", "aes"] }
aws-lc-rs = { version = "1.17.1", default-features = false, features = ["non-fips"] }
sha2 = { version = "0.10", default-features = false }
hkdf = "0.12"
hmac = "0.12"
blake3 = { version = "1.5", default-features = false }
rand_core = { version = "0.6", default-features = false }
subtle = { version = "2.5", default-features = false }
zeroize = { version = "1.7", default-features = false, features = ["derive"] }

# Async (kept minimal; only handshake/transport will need this)
tokio = { version = "1.40", default-features = false }

# TLS 1.3 outer wrapper (spec §4.2). `brotli` feature pulls in the
# CertDecompressor::Brotli implementation so we can advertise the
# `compress_certificate` (0x001b) TLS extension on the wire —
# matching Chrome 124's ClientHello shape and shifting JA4 ext_hash
# toward browser parity.
rustls = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12", "brotli"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
mimalloc = "0.1.52"
boring = "5.1.0"
tokio-boring = "5.0.0"

# X.509 parser — used by the α transport's cert-expiry observability
# surface to extract `notAfter` from a loaded cert chain. We pin the
# leaf cert only (chain[0]); intermediates' expiry is operator
# responsibility (renewed alongside via certbot). Audited Rust crate,
# MIT-licensed, the de-facto choice in the rustls/quinn ecosystem.
x509-parser = "0.18"

# Quinn does not expose whether a packet declared lost was later
# acknowledged, so an adaptive recovery controller cannot distinguish
# genuine loss from severe reordering. This focused 0.11.16 fork adds
# bounded severe-reordering replay protection plus confirmed-spurious-loss
# packet/time recovery adaptation; the exact commit is pinned so production
# builds remain reproducible.
[patch.crates-io]
quinn = { git = "https://github.com/Icarus603/quinn", rev = "dd02b67d81fa2121f517717739ecff2fd35afa0b" }
quinn-proto = { git = "https://github.com/Icarus603/quinn", rev = "dd02b67d81fa2121f517717739ecff2fd35afa0b" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# iter-24: `panic = "unwind"` (was "abort"). Production servers
# (nginx, envoy, HAProxy) all unwind per-connection so an isolated
# panic in one per-task closure doesn't tear down the whole
# process. tokio::spawn naturally catches panics in its tasks via
# the JoinHandle Future — with unwind, the task ends cleanly and
# the runtime continues servicing other connections. With abort,
# a single malformed connection's logic bug would kill every
# other in-flight session AND the accept loop AND the metrics
# endpoint AND the periodic self-test — and would make the
# iter-18/19/20/21 EMFILE-survival hardening moot.
#
# `proteus_panic_hook::install()` (called from both binaries'
# main()) still fires on every panic: it increments the
# Prometheus counter (`proteus_panics_total`) and emits a
# structured WARN log with file:line:col. Operators alert on
# `rate(proteus_panics_total[5m]) > 0` to spot panics in flight
# even when individual sessions survived.
#
# Optional `RUST_PANIC_ABORT=1` env var (handled inside
# panic_hook) re-aborts AFTER counting + logging, for operators
# who specifically want the fail-fast semantics (e.g.
# fuzz-testing harness, debug-build deployments). The default is
# now "survive" because production stability outweighs the
# fail-fast preference.
#
# Binary-size cost: ~30-50 KB of unwinding tables, negligible
# next to the ~15-20 MB of bundled rustls + quinn + ml-kem.
# Per-call codegen cost: a few extra instructions per non-leaf
# function — measured workspace throughput smoke unchanged
# between abort and unwind profiles.
panic = "unwind"
strip = "symbols"

[profile.dev]
opt-level = 1   # ml-kem / x25519 too slow at opt-level 0
