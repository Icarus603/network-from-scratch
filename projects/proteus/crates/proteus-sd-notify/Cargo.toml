[package]
name = "proteus-sd-notify"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
description = "Minimal sd_notify(3) client + watchdog heartbeat — wires Proteus binaries into systemd Type=notify with WatchdogSec= liveness"

[dependencies]
tokio = { workspace = true, features = ["net", "rt", "time", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
