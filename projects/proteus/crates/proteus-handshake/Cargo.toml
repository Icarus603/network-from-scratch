[package]
name = "proteus-handshake"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
description = "Proteus handshake state machine + anti-replay window (skeleton; full key schedule wired in M1)"

[dependencies]
proteus-spec = { path = "../proteus-spec" }
proteus-wire = { path = "../proteus-wire" }
proteus-crypto = { path = "../proteus-crypto" }
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
zeroize.workspace = true
thiserror.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
# proteus-fingerprint exercises the wire-format round-trip in
# the knock_wire_e2e integration test: craft ClientHello bytes,
# parse via parse_client_hello_with_components, feed
# session_id + client_random back into decode_and_verify_session_id.
# Strictly a test dep — production proteus-handshake doesn't
# need a parser.
proteus-fingerprint = { path = "../proteus-fingerprint" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
