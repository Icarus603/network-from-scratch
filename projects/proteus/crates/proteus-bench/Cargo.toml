[package]
name = "proteus-bench"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
authors.workspace = true
description = "Proteus end-to-end throughput / latency / loss benchmark harness — produces reproducible numbers for the 'speed vs Hy2/TUIC' comparison the README still owes"

[dependencies]
proteus-spec = { path = "../proteus-spec" }
proteus-wire = { path = "../proteus-wire" }
proteus-crypto = { path = "../proteus-crypto" }
proteus-transport-alpha = { path = "../proteus-transport-alpha" }
proteus-transport-beta = { path = "../proteus-transport-beta" }

tokio = { workspace = true, features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync", "fs"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand_core = { workspace = true, features = ["getrandom"] }
rcgen = "0.13"
rustls = { workspace = true }
hex = "0.4"
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
