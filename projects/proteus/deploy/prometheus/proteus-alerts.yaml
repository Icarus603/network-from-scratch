# Prometheus alert rules for Proteus production deployments.
#
# Load with `rule_files: ['/etc/prometheus/proteus-alerts.yaml']` in
# prometheus.yml, OR mount into a Prometheus Operator `PrometheusRule`
# resource. Every rule documented here corresponds to a real
# production-stability failure mode the binary surfaces via its
# /metrics endpoint.
#
# Severity grammar:
#   critical → operator must act now (paging-grade)
#   warning  → operator should investigate within the hour
#   info     → trending signal; dashboard panel, not a page
#
# Time windows are starting points; tune `for:` durations and
# rate-window sizes to your deployment's traffic profile + alert
# fatigue tolerance. The values below assume "personal VPN /
# small-team deployment" semantics: aggressive on hard failures,
# generous on transient blips.

groups:
- name: proteus-liveness
  interval: 30s
  rules:

  # /healthz already returns 503 on these conditions; the alert
  # fires when Prometheus itself sees `up == 0` for proteus-server
  # — i.e. the scrape FAILED entirely (process gone / network
  # partition). Catches both the panic-abort and the OOM-kill
  # classes.
  - alert: ProteusServerDown
    expr: up{job="proteus-server"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server scrape failing"
      description: |
        Prometheus could not scrape proteus-server on
        instance {{ $labels.instance }} for at least 1 minute.
        Process likely crashed (check systemd journalctl AND
        proteus_previous_run_unclean on next start).

  # The binary's own /healthz reports degraded — TLS cert expired,
  # self-test failed, or self-test stale. proteus_ready=0 doesn't
  # fire this (graceful drain is expected); proteus_up=0 does.
  - alert: ProteusServerUnhealthy
    expr: proteus_up == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server reports itself unhealthy"
      description: |
        proteus_up == 0 for {{ $labels.instance }} — listener
        not bound or the binary is mid-drain. If this fires
        OUTSIDE a maintenance window, investigate immediately.

  # Iter-102: drain stuck. proteus_ready=0 + proteus_up=1 is
  # the legitimate SIGTERM-drain state. If the binary stays
  # in this state for >5 min, the drain is wedged — either
  # in-flight sessions refuse to close, OR the operator's
  # supervisor never sent SIGKILL after the drain window.
  - alert: ProteusServerDrainStuck
    expr: proteus_ready == 0 and proteus_up == 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server has been draining for 5+ min"
      description: |
        proteus_ready=0 + proteus_up=1 on {{ $labels.instance }}
        for 5+ min — drain is wedged. Either in-flight
        sessions refuse to close (long-lived streams, dead
        upstream blocking the half-close handshake) OR the
        operator's supervisor (systemd / docker) never escalated
        to SIGKILL after the drain window. Check
        proteus_in_flight_sessions gauge + journalctl for the
        SIGTERM log line + drain-secs timeout.

- name: proteus-tls-cert
  interval: 30s
  rules:

  # Cert renewal pipeline silently failed → cert is now LIVE-
  # expired. /healthz also fires 503 here; this alert pages.
  - alert: ProteusTlsCertExpired
    expr: |
      (proteus_tls_cert_not_after_unix_seconds > 0)
      and (proteus_tls_cert_not_after_unix_seconds < time())
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server TLS cert EXPIRED"
      description: |
        The leaf certificate on {{ $labels.instance }} expired
        at {{ printf "%.0f" $value }}. Every future TLS
        handshake will fail. Run certbot renew (or your
        rotation tooling) IMMEDIATELY.

  - alert: ProteusTlsCertExpiringSoon
    expr: |
      (proteus_tls_cert_not_after_unix_seconds > 0)
      and ((proteus_tls_cert_not_after_unix_seconds - time()) < 14*86400)
      and ((proteus_tls_cert_not_after_unix_seconds - time()) > 0)
    for: 1h
    labels:
      severity: warning
    annotations:
      summary: "proteus-server TLS cert expires in <14 days"
      description: |
        Leaf cert expires at {{ printf "%.0f" $value }} on
        {{ $labels.instance }} — within the 14-day window.
        If Let's Encrypt auto-renewal is wired this should
        flip back to >14 days on the next renewal cycle. If
        not, fix it now.

  # Cert renewal hook ran (mtime changed) but Proteus's auto-
  # reload failed — operator is now serving the OLD cert and
  # doesn't know it.
  - alert: ProteusTlsAutoReloadFailing
    expr: |
      rate(proteus_tls_cert_watcher_auto_reload_failed_total[10m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server cert auto-reload failing"
      description: |
        Cert file mtime changed but the reload failed on
        {{ $labels.instance }}. Likely cause: new cert file is
        malformed or unreadable. Old cert is still being served.

- name: proteus-sighup-reload
  interval: 1m
  rules:

  # Iter-38: four SIGHUP-reloadable surfaces (firewall, rate_limit,
  # user_rate_limit, handshake_budget) each emit
  # (attempts_total, succeeded_total) counter pairs that the
  # operator can subtract to detect a silent edit-didn't-apply
  # failure. TLS cert reload has its own (mtime-driven, above)
  # rule; these are operator-edit-driven. WARN-not-CRIT because
  # the previous-known-good config is still in effect — service
  # is up, just running the wrong config.
  #
  # Symmetric with the client-side ProteusClientPoolReloadFailing
  # (deploy/prometheus/proteus-client-alerts.yaml).

  - alert: ProteusFirewallReloadFailing
    expr: |
      (proteus_firewall_reload_attempts_total
       - proteus_firewall_reload_succeeded_total) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server SIGHUP firewall reload silently failing"
      description: |
        On {{ $labels.instance }}: attempts_total exceeds
        succeeded_total. At least one SIGHUP reload of the
        allow/deny lists failed to apply. The running firewall
        is still the pre-SIGHUP version; the operator's edit
        didn't take effect. Check journalctl for the parse error.

  - alert: ProteusRateLimitReloadFailing
    expr: |
      (proteus_rate_limit_reload_attempts_total
       - proteus_rate_limit_reload_succeeded_total) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server SIGHUP rate-limit reload silently failing"
      description: |
        Global rate-limit config reload on
        {{ $labels.instance }} attempted but did not fully
        succeed. The previous-known-good rate-limit policy is
        still in effect. Check journalctl for the parse error.

  - alert: ProteusUserRateLimitReloadFailing
    expr: |
      (proteus_user_rate_limit_reload_attempts_total
       - proteus_user_rate_limit_reload_succeeded_total) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server SIGHUP per-user rate-limit reload silently failing"
      description: |
        Per-user rate-limit config reload on
        {{ $labels.instance }} attempted but did not fully
        succeed. Per-user buckets still use the pre-SIGHUP
        limits — the operator's edit didn't apply. Check
        journalctl for the parse error.

  - alert: ProteusHandshakeBudgetReloadFailing
    expr: |
      (proteus_handshake_budget_reload_attempts_total
       - proteus_handshake_budget_reload_succeeded_total) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server SIGHUP handshake-budget reload silently failing"
      description: |
        Handshake budget config reload on
        {{ $labels.instance }} attempted but did not fully
        succeed. Pre-SIGHUP budget is still in effect. Check
        journalctl for the parse error.

- name: proteus-probe-anomaly
  interval: 30s
  rules:

  # Iter-81: per-/24 source-IP probe-anomaly detector fires.
  #
  # The probe-anomaly detector triggers when a single /24
  # source range produces sustained cover-forward bursts
  # within the configured sliding window. Unlike the broader
  # ProteusCoverForwardStorm alert (which catches global
  # rate exhaustion), this is per-source-range attribution —
  # tells the operator WHICH /24 to firewall-deny.
  #
  # Pre-iter-81 the metric was emitted but no alert fired
  # on it directly; operators saw the existing
  # ProteusCoverForward{Rejecting,Storm} alerts and had to
  # manually grep the metric for the per-/24 breakdown.
  - alert: ProteusProbeAnomalyFired
    expr: rate(proteus_probe_anomalies_fired_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: probe-anomaly detector fired (per-/24 source attribution)"
      description: |
        {{ printf "%.3f" $value }} probe-anomaly fire(s)/sec
        on {{ $labels.instance }} for 5+ min. A specific /24
        source range is producing sustained cover-forward
        bursts beyond the configured threshold. Likely an
        active prober mapping the VPS surface. Use
        access_log + the structured probe_anomaly log line to
        identify the offending /24 + firewall-deny via
        `firewall.deny: [<source-cidr>/24]` + SIGHUP.

  - alert: ProteusProbeAnomalyCatastrophic
    expr: rate(proteus_probe_anomalies_fired_total[5m]) > 1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server: probe-anomaly fires > 1/sec — sustained attack"
      description: |
        {{ printf "%.3f" $value }} probe-anomaly fires/sec
        on {{ $labels.instance }} for 2+ min. Multiple /24
        ranges OR very high per-range frequency. Either way
        this is a coordinated probing campaign — consider
        raising pow_difficulty + tightening
        max_cover_forwards. Recovery requires identifying
        the source CIDR(s) from the access_log + firewall-deny.

- name: proteus-abuse-alerts
  interval: 30s
  rules:

  # Iter-79: per-user abuse fires (byte budget / rate limit /
  # bandwidth cap).
  #
  # The per-user abuse detectors trip when the SAME user_id
  # exceeds a quota multiple times within a sliding window:
  #   - byte_budget: session_byte_budget_exhausted bursts
  #   - rate_limit: token-bucket exhaustion bursts
  #   - per_user_bandwidth: byte-rate cap violations
  #
  # Each surface ships a counter; pre-iter-79 no alert fired
  # on the cumulative tally. An attacker holding a credential
  # and scripting heavy use was invisible outside the
  # access_log audit path.
  - alert: ProteusAbuseAlertsByteBudget
    expr: rate(proteus_abuse_alerts_byte_budget_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: per-user byte-budget abuse fires observed"
      description: |
        {{ printf "%.3f" $value }} byte-budget abuse fire(s)/sec
        on {{ $labels.instance }} for 5+ min. The per-user
        byte-budget detector fires when the SAME user_id hits
        the session-bytes cap repeatedly within the sliding
        window. Likely an attacker scripting bulk transfers
        with a single credential. Audit access_log for the
        offending user_id; consider per-user quota tightening
        or credential rotation.

  - alert: ProteusAbuseAlertsRateLimit
    expr: rate(proteus_abuse_alerts_rate_limit_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: per-user rate-limit abuse fires observed"
      description: |
        {{ printf "%.3f" $value }} rate-limit abuse fire(s)/sec
        on {{ $labels.instance }} for 5+ min. The per-user
        rate-limit detector fires when one user_id sustains
        token-bucket exhaustion. Likely an attacker hammering
        connections with a single credential. Audit
        access_log for the offending user_id + consider
        credential rotation.

  - alert: ProteusAbuseAlertsBandwidth
    expr: rate(proteus_abuse_alerts_per_user_bandwidth_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: per-user bandwidth-rate abuse fires observed"
      description: |
        {{ printf "%.3f" $value }} bandwidth-rate abuse fire(s)/sec
        on {{ $labels.instance }} for 5+ min. The per-user
        bandwidth-rate cap was exceeded multiple times. Likely
        an attacker downloading bulk content on stolen
        credentials. Audit + rotate as above.

- name: proteus-rejection-rates
  interval: 30s
  rules:

  # Iter-99: rejection-counter alerts.
  #
  # Each per-policy rejection counter signals a different
  # attack/operator-error mode. Pre-iter-99 these counters
  # were exposed but no alert fired on creep — operators
  # only saw them on the dashboard if they were actively
  # watching.
  - alert: ProteusFirewallDeniedHighRate
    expr: rate(proteus_firewall_denied_total[5m]) > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: firewall denials > 1/sec — active scan"
      description: |
        {{ printf "%.3f" $value }} firewall denials/sec on
        {{ $labels.instance }} for 5+ min. Sustained probing
        from blocked source ranges. Cross-reference with
        proteus_probe_anomalies_fired_total for per-/24
        attribution.

  - alert: ProteusHandshakeBudgetExhausted
    expr: rate(proteus_handshake_budget_rejected_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: global handshake budget exhausting"
      description: |
        {{ printf "%.3f" $value }} budget rejections/sec on
        {{ $labels.instance }} for 5+ min. The global
        handshake budget (token bucket) is hitting its cap.
        Either legitimate burst above operator's configured
        budget, OR a DDoS attempting to exhaust the gate.
        Raise handshake_budget.burst + refill_per_sec if
        legitimate; firewall-deny the source range if
        attack.

  - alert: ProteusConnLimitRejecting
    expr: rate(proteus_conn_limit_rejected_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: max_connections cap hit"
      description: |
        {{ printf "%.3f" $value }} connection-cap rejections/sec
        on {{ $labels.instance }} for 5+ min. The global
        max_connections semaphore is full — new accepts are
        dropped. Operator likely needs to raise max_connections
        OR investigate FD-leak / slow-shutdown sessions
        holding slots indefinitely.

  - alert: ProteusUserRateRejected
    expr: rate(proteus_user_rate_rejected_total[5m]) > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: per-user rate-limit rejecting > 0.5/sec"
      description: |
        {{ printf "%.3f" $value }} per-user rate rejections/sec
        on {{ $labels.instance }} for 5+ min. One or more
        user_ids hammering above the configured per-user
        rate. Audit access_log for the offending user_id;
        cross-reference proteus_abuse_alerts_rate_limit_total
        for the sliding-window abuse signal.

  - alert: ProteusUserQuarantineRejecting
    expr: rate(proteus_user_quarantine_rejected_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: quarantined-user sessions being rejected"
      description: |
        {{ printf "%.3f" $value }} quarantine rejections/sec
        on {{ $labels.instance }} for 5+ min. Auto-quarantine
        is actively gating sessions — the offending user_id
        was earlier marked for ban (byte_budget /
        rate_limit / bandwidth_rate trip). Audit access_log
        + decide credential rotation.

  # Iter-105: per-user quota admission rejections. Fires when
  # a user_id has consumed their full period_bytes cap and
  # NEW sessions for that user are admission-rejected. WARN-
  # grade because this is the QUOTA SYSTEM WORKING — the
  # operator just wants visibility on which user is at cap.
  - alert: ProteusUserQuotaAdmissionRejecting
    expr: rate(proteus_user_quota_admission_rejected_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: per-user quota cap rejecting new sessions"
      description: |
        {{ printf "%.3f" $value }} quota admission rejections/sec
        on {{ $labels.instance }} for 5+ min. One or more
        user_ids have consumed their full period_bytes cap;
        new sessions for those users are immediately
        rejected at admission. Either expected (user hit
        their quota — surface to them via the application
        layer if desired) OR the operator's quota is too
        tight for legitimate use. Audit access_log + adjust
        per-user override OR raise default_period_bytes.

- name: proteus-aead-integrity
  interval: 30s
  rules:

  # Iter-98: AEAD drops — bit-level integrity failures on the
  # data plane.
  #
  # Each AEAD decryption rejection means: an attacker flipped
  # bits in a record (active MITM tampering), OR the protocol
  # state machine has a bug (key rotation race, replay window
  # mismatch). Steady-state should be flat zero. ANY non-zero
  # rate is investigation-grade; sustained > 1/sec is active
  # attack-grade.
  - alert: ProteusAeadDropsObserved
    expr: rate(proteus_aead_drops_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: AEAD decryption rejections observed"
      description: |
        {{ printf "%.3f" $value }} AEAD drop(s)/sec on
        {{ $labels.instance }} for 5+ min. Each rejection is a
        bit-level integrity failure — either an active MITM
        tampering with records OR a protocol state machine bug
        (key rotation race, replay window mismatch). Audit
        access_log for the affected session; cross-reference
        proteus_ratchets_total (high ratchet activity + AEAD
        drops = key-rotation race).

  - alert: ProteusAeadDropsCatastrophic
    expr: rate(proteus_aead_drops_total[5m]) > 1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server: AEAD drops > 1/sec — active integrity attack"
      description: |
        {{ printf "%.3f" $value }} AEAD drop(s)/sec on
        {{ $labels.instance }} for 2+ min. Sustained bit-level
        tampering attempt. Action: identify the affected
        source IP from the access_log AEAD drop messages,
        firewall-deny the source range immediately. If this
        affects MULTIPLE source IPs, the threat model is
        worse than a single MITM — investigate as a
        co-ordinated attack.

- name: proteus-handshake-failures
  interval: 30s
  rules:

  # Iter-98: handshake failures — credential-bruteforce /
  # protocol-incompatible-client / active-rejection signal.
  - alert: ProteusHandshakeFailuresHigh
    expr: |
      rate(proteus_handshakes_failed_total[5m]) > 0.5
      and
      rate(proteus_handshakes_failed_total[5m])
        > rate(proteus_handshakes_succeeded_total[5m]) * 0.1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: handshake failure rate > 10% of successes"
      description: |
        {{ printf "%.3f" $value }} handshake failure(s)/sec on
        {{ $labels.instance }} (>10% of success rate) for 10+
        min. Likely cause: credential bruteforce (attacker
        rotating user_ids / pubkeys), protocol-incompatible
        client (operator's old client.yaml is stale after a
        rotation), OR active GFW-style probing trying to
        elicit Proteus responses.

- name: proteus-ssrf-attempts
  interval: 30s
  rules:

  # Iter-76: outbound-destination-filter rejections.
  #
  # The OutboundFilter blocks SSRF-class CONNECT targets: cloud
  # metadata (169.254.169.254 — IAM creds), RFC 1918, link-local,
  # loopback, IPv6 ULA. A rising
  # `proteus_outbound_blocked_total` counter is the operator-
  # facing signal of:
  #   (a) credential compromised + attacker probing the operator's
  #       internal network via the proxy as an SSRF gateway
  #   (b) misconfigured client trying to reach an internal
  #       service it doesn't have a legitimate path to
  #
  # Pre-iter-76 the metric existed but no alert fired — the
  # operator would only see the SSRF probing in the access_log
  # if they audit by hand. Now both Prometheus and the
  # in-process alerts-check evaluator catch it.
  - alert: ProteusSsrfAttemptsObserved
    expr: rate(proteus_outbound_blocked_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server: SSRF / outbound-filter rejections observed"
      description: |
        {{ printf "%.2f" $value }} outbound-filter block(s)/sec
        on {{ $labels.instance }} for 5+ min. Likely causes:
        (a) credential compromised + attacker probing internal
        network via proxy SSRF; (b) misconfigured client
        targeting internal services. Audit access_log for the
        offending user_id + destination; consider rotating the
        affected ed25519 key.

  - alert: ProteusSsrfAttemptsCatastrophic
    expr: rate(proteus_outbound_blocked_total[5m]) > 1
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server: SSRF attempts at >1/sec — active attack"
      description: |
        {{ printf "%.2f" $value }} outbound-filter block(s)/sec
        on {{ $labels.instance }} for 2+ min — sustained SSRF
        probing. Treat as credential compromise: rotate the
        affected user's ed25519 key immediately, audit
        access_log for the destination pattern, consider adding
        the source IP to the firewall deny list.

- name: proteus-handshake-latency
  interval: 30s
  rules:

  # Iter-74: handshake p99 latency creep.
  #
  # The Proteus handshake runs ML-KEM Decap (~70 µs on a modern
  # server core) + Ed25519 sig verify + Finished MAC computation
  # + AEAD key derivation. Steady-state p99 should be < 50 ms on
  # any reasonable hardware (the bulk is TLS handshake roundtrip
  # over the network, not crypto).
  #
  # A sustained p99 > 200 ms is the operator-facing signal of:
  #   (a) CPU exhaustion attack — attacker bypasses PoW gate
  #       somehow (PoW disabled, or attacker has compute budget)
  #       and floods ML-KEM Decap calls
  #   (b) the cover endpoint is slow and cover-forward latency
  #       (which feeds into the handshake measurement on auth-
  #       fail paths) is dragging the histogram
  #   (c) VPS noisy neighbor / disk swap pressure
  #
  # Warning-grade because the binary still serves traffic; the
  # operator should investigate within the hour, not page at 3 AM.
  - alert: ProteusHandshakeLatencyP99High
    expr: |
      histogram_quantile(0.99, rate(proteus_handshake_duration_seconds_bucket[5m])) > 0.2
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "proteus-server handshake p99 latency exceeded 200ms"
      description: |
        p99 handshake latency on {{ $labels.instance }} is
        {{ printf "%.3f" $value }}s — above the 200ms threshold
        for 10+ minutes. Likely causes: (a) PoW-bypass attack
        flooding ML-KEM Decap, (b) slow cover endpoint, (c) VPS
        CPU/disk pressure. Cross-reference proteus_panics_total
        + proteus_cover_forwards_total + the VPS host's loadavg.

  # Iter-74: handshake p99 latency CATASTROPHIC.
  #
  # Sustained p99 > 1 second means crypto is the bottleneck
  # in every handshake; clients see browser timeouts; the
  # server is effectively DoS'd. Page immediately.
  - alert: ProteusHandshakeLatencyP99Catastrophic
    expr: |
      histogram_quantile(0.99, rate(proteus_handshake_duration_seconds_bucket[5m])) > 1.0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "proteus-server handshake p99 latency exceeded 1s — clients timing out"
      description: |
        p99 handshake latency on {{ $labels.instance }} is
        {{ printf "%.3f" $value }}s — clients with default
        ~10s timeouts will start failing dial. Likely an
        active CPU-exhaustion attack. Raise pow_difficulty
        in server.yaml + SIGHUP, OR restart-with-firewall to
        block the offending source range.

- name: proteus-runtime-health
  interval: 30s
  rules:

  # Spawned-task panic captured. Tokio absorbs them silently; the
  # panic_hook surfaces them via this counter + a structured
  # tracing line. ANY new panic in the steady state is worth
  # investigating.
  - alert: ProteusPanic
    expr: rate(proteus_panics_total[5m]) > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "proteus panic captured"
      description: |
        {{ $value }} panic(s)/sec on {{ $labels.instance }}.
        Check `journalctl -u proteus-server -o json |
        jq 'select(.target=="proteus_panic")'` for the
        thread/location/message.

  # Restart-loop detection. >1 restart per hour is operationally
  # alarming for any long-lived daemon.
  - alert: ProteusRestartLoop
    expr: rate(proteus_restarts_total[1h]) > 1/3600
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "proteus is restart-looping"
      description: |
        {{ printf "%.2f" $value }} restarts/sec on
        {{ $labels.instance }}. Likely cause: panic-abort
        loop, OOM kill, or systemd watchdog tripping. Check
        proteus_previous_run_unclean and the journal.

  # Previous run exited uncleanly (panic-abort, OOM kill,
  # segfault, kill -9). One-shot signal — alert when freshly
  # observed.
  - alert: ProteusUncleanShutdown
    expr: proteus_previous_run_unclean == 1
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "proteus's previous run exited uncleanly"
      description: |
        proteus_previous_run_unclean=1 on {{ $labels.instance }}.
        Either a panic-abort, OOM kill, segfault, or kill -9
        ended the previous run. Cross-reference the previous
        run's journal for the root cause.

- name: proteus-self-test
  interval: 30s
  rules:

  # Early-warning: streak at threshold-minus-one. One more
  # failure drains the box. Doesn't page (still healthy) but
  # alerts an operator that the box is one blip from draining
  # — useful for catching a developing degradation before LB
  # rotation kicks in.
  - alert: ProteusSelfTestStreakNearThreshold
    expr: |
      (proteus_consecutive_periodic_self_test_failures > 0)
      and (proteus_periodic_self_test_failure_threshold > 1)
      and ((proteus_consecutive_periodic_self_test_failures + 1)
            >= proteus_periodic_self_test_failure_threshold)
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "proteus self-test failure streak one away from healthz drain"
      description: |
        consecutive_periodic_self_test_failures =
        {{ printf "%.0f" $value }} on {{ $labels.instance }},
        threshold = {{ printf "%.0f" $value }}. One more failure
        flips /healthz to 503 and drops this box from LB
        rotation. Investigate now.

- name: proteus-network
  interval: 30s
  rules:

  # Wedged recursive DNS resolver. Pegs every relay task at the
  # 5s lookup timeout.
  - alert: ProteusDnsResolverWedged
    expr: |
      rate(proteus_dns_lookups_total{outcome="timeout"}[5m]) > 0
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "proteus DNS lookups timing out"
      description: |
        {{ printf "%.2f" $value }} DNS timeouts/sec on
        {{ $labels.instance }} for the last 5 min — the
        recursive resolver may be wedged. Every timed-out
        lookup wastes a relay task's 5-second window.

  # Hot rejection path under sustained pressure (scanner / DoS).
  - alert: ProteusRejectionLogThrottleFiring
    expr: |
      rate(proteus_log_throttle_suppressed_total[5m]) > 1
    for: 5m
    labels:
      severity: info
    annotations:
      summary: "proteus log-throttle suppressing >1 line/sec"
      description: |
        Site={{ $labels.site }} on {{ $labels.instance }}
        suppressing {{ printf "%.1f" $value }} similar
        WARN lines per second — almost certainly a scanner /
        DoS prober hitting a rejection path. Real failure
        signal is preserved (the throttle is per-site); this
        is just visibility.

  # Iter-20 added the `cover_forward_limit` semaphore that caps
  # concurrent cover-forward tasks. Rejections here mean
  # either (a) the cap is set too low for the probe-load
  # profile, OR (b) the cover endpoint is slow/unhealthy
  # (cover tasks not exiting → semaphore stays drained →
  # legitimate cover-forwards get dropped instead of being
  # spliced). Either way it's an operator-visible symptom
  # they should investigate — bump `max_cover_forwards` or
  # check cover endpoint health.
  - alert: ProteusCoverForwardRejecting
    expr: |
      rate(proteus_cover_forwards_rejected_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "proteus cover-forward semaphore rejecting"
      description: |
        {{ $labels.instance }} is dropping cover-forward
        requests at {{ printf "%.2f" $value }} per second.
        Either the configured `max_cover_forwards` cap is too
        low for the current probe-load profile, OR the cover
        endpoint is slow/unhealthy (existing cover tasks not
        exiting → semaphore drained). Bump
        `max_cover_forwards` OR check cover endpoint latency
        / availability. Pre-iter-20 these would have manifested
        as EMFILE on the accept loop (iter-18 backoff would
        kick in but the server would be under sustained FD
        pressure).

  # Cover-forward sustained-burst rate. Even with the cap in
  # place, a high success rate of cover-forwards indicates
  # active probing. The probe-anomaly detector
  # (`proteus_probe_anomalies_fired_total`) catches the
  # per-/24 burst pattern; this is the absolute-rate alert
  # for "the box is under a sustained probe storm of any
  # source distribution." Bumps to `warning` severity at
  # sustained >100/sec — that's roughly the rate where
  # iter-14 NAT keepalive + iter-15 timeouts + iter-20
  # cover-cap start mattering operationally.
  - alert: ProteusCoverForwardStorm
    expr: |
      rate(proteus_cover_forwards_total[5m]) > 100
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "proteus sustained cover-forward storm"
      description: |
        {{ $labels.instance }} cover-forwarded
        {{ printf "%.0f" $value }} connections/sec for 10
        min. Almost certainly active probing against this
        VPS. Cross-reference with
        `proteus_probe_anomalies_fired_total` to see if any
        particular /24 prefix is the source.

- name: proteus-audit
  interval: 1m
  rules:

  # Access-log writer task exited (disk full, FS RO, fsync
  # failure). PAGES because audit-trail loss is a
  # compliance-relevant silent failure.
  - alert: ProteusAccessLogWriterDead
    expr: |
      (proteus_access_log_writer_alive == 0) and (proteus_up == 1)
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "proteus access-log writer task has died"
      description: |
        proteus is running but the access-log writer task is
        dead on {{ $labels.instance }}. Every subsequent
        session is dropping its audit record. Most likely
        cause: disk full, log file unwritable, or fsync
        failure. Free disk / fix permissions, then `systemctl
        restart proteus-server`.

  # Access-log channel chronically full — the writer can't drain
  # at producer rate.
  - alert: ProteusAccessLogChannelChronicallyFull
    expr: |
      rate(proteus_access_log_records_total{outcome="dropped_channel_full"}[10m]) > 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "proteus access-log dropping records (channel full)"
      description: |
        Producer rate exceeds writer drain rate on
        {{ $labels.instance }} for 10+ minutes — bump the
        channel capacity OR move the access log to a faster
        disk. Transient bursts are normal; sustained
        dropping means the audit is incomplete.
