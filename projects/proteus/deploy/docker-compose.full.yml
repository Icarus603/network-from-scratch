# Full reference observability stack: proteus-server +
# proteus-client + Prometheus + Grafana, all auto-wired.
#
# `docker compose -f docker-compose.full.yml up -d` brings up
# the complete deploy with metrics, alerts, and a starter
# dashboard at http://localhost:3000 (admin/admin on first
# login). Use this for:
#
#   * fresh operator onboarding — see what the production
#     surface looks like before tailoring it,
#   * local end-to-end testing of new alert rules / dashboards,
#   * pre-flight before shipping to a real Kubernetes /
#     systemd / bare-VPS deploy.
#
# The minimal `docker-compose.yml` in this dir stays as the
# server-only quick-start; this file is the "full reference"
# variant.
#
# Notes on the bundled configs vs production:
#   * proteus-server here listens on 0.0.0.0:9090 inside the
#     container so the Prometheus container can scrape; in
#     production with systemd the metrics bind stays at
#     127.0.0.1:9090 with token gating.
#   * proteus-client's admin_listen is bound on 0.0.0.0:9091
#     for the same reason. Single-user laptops keep the
#     127.0.0.1 default.
#   * Grafana is wide-open on :3000 with admin/admin — change
#     GF_SECURITY_ADMIN_PASSWORD before exposing.

services:
  proteus-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    image: proteus/server:0.1.0
    container_name: proteus-server
    restart: unless-stopped
    # bridge-mode (NOT host) so the prometheus container can
    # reach this on the shared docker network via DNS name.
    networks:
      - proteus-net
    ports:
      # Expose 8443 to the host so a real client (or another
      # box) can connect. Drop this for an internal-only setup.
      - "8443:8443/tcp"
    volumes:
      - ./server.yaml:/etc/proteus/server.yaml:ro
      - ./keys:/etc/proteus/keys:ro
      - proteus_logs:/var/log/proteus
      - proteus_state:/var/lib/proteus
    environment:
      RUST_LOG: "proteus_server=info,proteus_transport_alpha=info"
      MIMALLOC_PURGE_DELAY: "${MIMALLOC_PURGE_DELAY:-0}"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # Healthcheck uses the in-container /readyz probe via curl.
    healthcheck:
      test: ["CMD", "/usr/local/bin/proteus-server-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 35s

  proteus-client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: client
    image: proteus/client:0.1.0
    container_name: proteus-client
    restart: unless-stopped
    depends_on:
      proteus-server:
        condition: service_healthy
    networks:
      - proteus-net
    ports:
      # Expose SOCKS5 on the host so curl --socks5 localhost:1080
      # works from the host. Drop this if the client should only
      # serve other containers on the same network.
      - "1080:1080/tcp"
    volumes:
      - ./client.yaml:/etc/proteus/client.yaml:ro
      - ./keys:/etc/proteus/keys:ro
      - proteus_utls_socket:/run/proteus
    environment:
      RUST_LOG: "proteus_client=info,proteus_transport_alpha=info"
      MIMALLOC_PURGE_DELAY: "${MIMALLOC_PURGE_DELAY:-0}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 20s

  proteus-utls-bridge:
    profiles: ["utls"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: utls-bridge
    image: proteus/utls-bridge:0.1.0
    container_name: proteus-utls-bridge
    restart: unless-stopped
    depends_on:
      proteus-server:
        condition: service_healthy
    networks:
      - proteus-net
    volumes:
      - ./keys:/etc/proteus/keys:ro
      - proteus_utls_socket:/run/proteus
    command:
      - /usr/local/bin/proteus-utls-bridge
      - --listen
      - /run/proteus/utls.sock
      - --knock-psk
      - /etc/proteus/keys/server.knock_psk
      - --trusted-ca
      - /etc/proteus/keys/tls/fullchain.pem
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/proteus/utls.sock"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    networks:
      - proteus-net
    ports:
      # Expose Prometheus UI to localhost for inspection.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/proteus-alerts.yaml:/etc/prometheus/proteus-alerts.yaml:ro
      - ./prometheus/proteus-client-alerts.yaml:/etc/prometheus/proteus-client-alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - proteus-net
    ports:
      # Expose Grafana UI to localhost. Default login admin/admin.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # CHANGE THIS before exposing to anything but localhost.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  proteus_logs:
  proteus_state:
  proteus_utls_socket:
  prometheus_data:
  grafana_data:

networks:
  proteus-net:
    driver: bridge
