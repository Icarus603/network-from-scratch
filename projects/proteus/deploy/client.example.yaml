# Proteus client config example.
# Copy to /etc/proteus/client.yaml or run with `--config ./client.yaml`.
#
# Supports dual-stack carriers:
#   - α (TCP + TLS 1.3): always available as fallback.
#   - β (QUIC over UDP): optional, much faster on lossy paths.
# When both are configured the client uses happy-eyeballs: tries β
# first with a short timeout, falls back to α on any β failure.

# Remote Proteus server `host:port` for the α (TCP+TLS) carrier.
# REQUIRED — this is the always-available fallback path.
#
# ## Bootstrap-DNS posture (2026 GFW P0)
#
# `server_endpoint` can be either:
#   (a) a hostname:port — `"vps.example.com:8443"` — system resolver
#       used at every dial. In 2026 the GFW identifies DoH/DoT by flow
#       pattern; if your OS resolver hops through a DoH server the
#       bootstrap can be flagged BEFORE any Proteus payload is sent.
#       See qa/2026-05-17-gfw-2026-q1q2-threat-intel.md main line 6.
#   (b) an IP literal:port — `"198.51.100.42:8443"` — recommended for
#       production anti-censorship deploys. The TLS SNI continues to
#       use the hostname from `tls.server_name` below (cert
#       verification works normally); only the L3 lookup is skipped.
#   (c) hostname:port + `bootstrap_dns: { direct_ip: <vps-ip> }`
#       below — equivalent to (b), keeps the hostname visible for
#       readability while still pinning resolution.
#
# `proteus-client validate` warns when you leave a hostname here
# without `bootstrap_dns: direct_ip`.
server_endpoint: "vps.example.com:8443"

# Optional multi-VPS HA fallback list. When set, the dispatcher
# tries entries in order; per-endpoint health tracking (sibling of
# the β CarrierHealth back-off) skips suppressed entries after 3
# consecutive failures with capped exponential back-off + periodic
# recovery probes. Operator-opt-in for personal-scale HA without
# any external load balancer.
#
# Convention: include `server_endpoint` as entry [0] of this list
# so the primary stays at the top of the failover order. The
# `validate` subcommand warns if `server_endpoint` is missing
# from the pool (suspicious split-brain configuration).
#
# WIRED 2026-05-18 (follow-up to the foundation commit of the
# same day): SOCKS dispatch consults the pool via
# `handle_socks5_with_health_and_pool`. Setting this field now
# gets real per-entry failover with EndpointHealth tracking.
#
# server_endpoints:
#   - "vps.example.com:8443"
#   - "vps-backup.example.com:8443"
#   - "vps-cn2-backup.example.com:8443"

# Optional bootstrap-DNS policy. See the discussion above
# `server_endpoint`. Pick ONE form:
#
#   bootstrap_dns: system           # default (vulnerable to DoH ID + DNS hijack)
#   bootstrap_dns:
#     direct_ip: 198.51.100.42      # IPv4 pin (production-recommended)
#   bootstrap_dns:
#     direct_ip: "2001:db8::1"      # IPv6 pin
#
# A direct_ip pin is harmless when `server_endpoint` is already
# an IP literal — the literal wins, the pin is unused (validate
# tells you so).
# bootstrap_dns:
#   direct_ip: 198.51.100.42

# Optional β (QUIC over UDP) endpoint on the same server. When set,
# the client tries β first; on any β failure (timeout, UDP blocked,
# cert mismatch, peer doesn't support DATAGRAM) it falls back to α.
# Strongly recommended in production — β with BBR + zero-HoL
# DATAGRAM beats α handily on lossy long-fat-pipe paths.
#
# Typical deployment: server binds α to :443/tcp and β to :443/udp
# on the same host, so this client config has identical strings
# for both endpoints.
# server_endpoint_beta: "vps.example.com:8443"

# Optional override for β's TLS SNI. Defaults to `tls.server_name`
# below (the common case: same Let's Encrypt cert for both carriers).
# Only set this when the operator has split cert/SNI per carrier.
# beta_server_name: "vps.example.com"

# Per-connection timeout (seconds) for the β-first dial attempt
# before falling back to α. Default 3s. Tune up for high-RTT paths
# (transcontinental: 5s), down for LAN-only deployments (1s).
#
# ## Carrier-health back-off (built-in, no config)
#
# The client tracks β's recent success/failure pattern in a
# per-process `CarrierHealth` state. After 3 consecutive β
# failures (the kind of pattern UDP throttling / blocked UDP
# egress / sustained GFW interference produces), β attempts are
# SUPPRESSED for 15s; subsequent failures double the suppression
# window (15s → 30s → 60s → 120s → 240s → 300s cap). During
# suppression, every 32nd CONNECT probes β anyway — a single
# success clears suppression so transient UDP outages recover
# automatically.
#
# Without back-off, every CONNECT would pay `beta_first_timeout_secs`
# of pointless waiting on a UDP-blocked network. With it, only the
# first 3 CONNECTs of a failure burst pay the cost; subsequent
# CONNECTs skip straight to α.
#
# beta_first_timeout_secs: 3
#
# β QUIC performance / traffic-analysis tunables. Defaults:
#   beta_initial_mtu = 1350              (conservative; covers most paths)
#   beta_pad_quic_to_mtu = false         (max throughput; UDP wire-length leaks)
#   beta_allow_spin_bit = false          (PRIVACY: defeats passive on-path RTT
#                                         inference; quinn upstream defaults to true)
#   beta_ack_eliciting_threshold = 1     (DISABLED — RFC 9802 ACK reduction
#                                         breaks BBR on sub-ms RTT paths;
#                                         opt in to 10 ONLY for measured
#                                         long-fat-pipe deploys)
#   beta_mtu_upper_bound = 1452          (Ethernet max under IPv6+UDP)
#
# Production anti-censorship config (match server-side settings —
# the choices interact with quinn's path-MTU discovery):
#   beta_initial_mtu: 1452          (max under 1500-byte Ethernet MTU)
#   beta_pad_quic_to_mtu: true      (UDP-layer length-uniformity defeats
#                                    GFW QUIC datagram-size analysis)
# beta_initial_mtu: 1350
# beta_pad_quic_to_mtu: false

# Local SOCKS5 inbound. Point your browser / curl / sing-box at this.
socks_listen: "127.0.0.1:1080"

# Opt-in admin / observability endpoint. When set, exposes:
#   GET /healthz     — 200 once SOCKS5 has bound; 503 before.
#   GET /status      — text snapshot (CarrierHealth + EndpointPool state).
#   GET /status.json — JSON snapshot (line-delimited).
#
# Operator workflow: `proteus-client status` (queries /status by
# default). Mirrors what `proteus-server admin status` does for the
# server side — answers "is β suppressed right now? which VPS am I
# dialing?" without grepping journalctl.
#
# *** NO AUTHENTICATION. Bind loopback only. ***
# Non-loopback binds emit a startup `warn!` and `proteus-client
# validate` flags them with WARN — they're allowed for trusted-LAN
# deploys but not recommended.
#
# Default: unset = admin endpoint disabled, no extra port bound.
# admin_listen: "127.0.0.1:9091"

# Your user ID — must match an entry in the server's `client_allowlist`.
user_id: "alice001"

# Keys distributed by the server admin.
keys:
  server_mlkem_pk: ./keys/server_lt.mlkem768.pk
  server_x25519_pk: ./keys/server_lt.x25519.pk
  server_pq_fingerprint: ./keys/server_lt.pq.fingerprint
  client_ed25519_sk: ./keys/client/client.ed25519.sk

# Outer TLS 1.3 wrapper (must match server's `tls:` block).
# - `server_name` is the SAN on the server's certificate.
# - `trusted_ca` is optional: only set it when the server uses a
#   self-signed cert. Production with Let's Encrypt: leave commented out
#   and the client trusts webpki-roots automatically.
tls:
  server_name: vps.example.com
  # trusted_ca: ./keys/tls/self-signed-ca.pem

# Server-advertised anti-DoS difficulty (must match server's setting).
# When the server raises this, update the client config too; mismatched
# values lead to handshake reject (silent route to cover).
pow_difficulty: 0

# Data-plane padding quantum (bytes) for the client→server direction.
# When non-zero, every outgoing AEAD record is length-prefixed and
# zero-padded to a multiple of this value before encryption, so a
# passive observer measuring upload record lengths learns only "which
# quantum bucket" (spec §4.6 / §22). Independent of the server's
# `pad_quantum` knob.
#
# Recommended values:
#   - 0 / unset: no padding, max throughput, wire lengths leak
#   - 64: ~1% overhead at 16 KiB, kills sub-64-byte signal
#   - 1280: matches β cell size, full sub-cell hiding (~5% overhead)
#
# For true traffic-analysis resistance set BOTH client and server
# `pad_quantum` (otherwise one direction stays unpadded).
# pad_quantum: 64
